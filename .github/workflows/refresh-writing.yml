name: Refresh writing

# Pulls the LessWrong + Substack feeds once a day and bakes any new posts into
# index.html. Commits only when something changed; that push auto-deploys on Railway.
on:
  schedule:
    - cron: "17 6 * * *" # daily, ~06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write # for the keepalive step below

concurrency:
  group: refresh-writing
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch latest posts
        run: python build/fetch_posts.py
      - name: Commit if writing changed
        run: |
          if [ -n "$(git status --porcelain index.html)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "chore: refresh writing from feeds"
            git push
          else
            echo "No writing changes."
          fi
      # GitHub disables scheduled workflows after 60 days without repo activity (this
      # one was, on 2026-09-22). Re-enabling it on every run resets that timer.
      - name: Keep schedule alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/refresh-writing.yml/enable"
